<!DOCTYPE html><html><head><style>@media (max-width:700px){body{margin:0}}</style></head>
<body>
<section class="panel"><p class="kicker">Problem</p><h2>A drawing</h2>
<svg viewBox="0 0 500 300" role="img" aria-label="percent coord"><rect x="10%" y="20%" width="50%" height="10"></rect>
<text x="20%" y="30" font-size="16">label</text></svg></section>
<section class="panel"><p class="kicker">Build</p><h2>Another</h2>
<svg viewBox="0 0 500 300" role="img" aria-label="bar"><rect x="10" y="10" width="100" height="40"></rect><text x="20" y="30" font-size="16">b</text></svg></section>

<svg viewBox="0 0 10 10" role="img" aria-label="scale"></svg></section>
<link rel="stylesheet" href="../eli5-study.css"><script src="../eli5-study.js"></script>
<div class="eli5-study-container"><div class="study-masthead"></div></div>

</body></html>
